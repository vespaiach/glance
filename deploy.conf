# shipit deploy config (docs/deploy.md). Glance must run as exactly one process: the sync bus is in memory.
# next start, not the standalone server.js: server.js changes its working directory, and the migrations
# are read from process.cwd()/db/migrations.
INSTALL="npm ci --no-audit --no-fund"
BUILD="npm run build"
HEALTH_PATH=/signin
PROCESS_web="next start --hostname 127.0.0.1 --port $PORT"
